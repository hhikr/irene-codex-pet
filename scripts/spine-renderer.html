<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,">
<script src="/vendor/pixi.min.js"></script><script src="/vendor/pixi-spine.umd.js"></script>
<body><script>
const app=new PIXI.Application({width:768,height:832,transparent:true,antialias:true,autoStart:false,preserveDrawingBuffer:true});
document.body.appendChild(app.view);let pet;
window.loadPet=async url=>{
  if(pet){app.stage.removeChild(pet);pet.destroy({children:true})}
  const data=await new Promise((resolve,reject)=>{const loader=new PIXI.Loader();loader.onError.add(error=>reject(error));loader.add('pet',url).load((loader,resources)=>resources.pet.spineData?resolve(resources.pet.spineData):reject(new Error('Spine model failed to load: '+JSON.stringify({error:resources.pet.error,keys:Object.keys(resources.pet)}))))});
  pet=new PIXI.spine.Spine(data);pet.autoUpdate=false;app.stage.addChild(pet);
  return {animations:data.animations.map(a=>({name:a.name,duration:a.duration})),bones:data.bones.map(b=>b.name),version:data.version};
};
function pose(name,time){pet.skeleton.setToSetupPose();pet.state.clearTracks();pet.state.setAnimation(0,name,false);pet.update(time);}
window.measure=(name,time)=>{pet.position.set(0,0);pet.scale.set(1);pose(name,time);app.renderer.render(app.stage);const b=pet.getLocalBounds();return {x:b.x,y:b.y,width:b.width,height:b.height};};
window.capture=(name,time,fit)=>{pet.position.set(fit.x,fit.y);pet.scale.set(fit.scale);pose(name,time);app.renderer.render(app.stage);return app.view.toDataURL('image/png');};
window.captureLook=(direction,fit)=>{pet.position.set(fit.x,fit.y);pet.scale.set(fit.scale);pose('Default',0);const angle=direction*Math.PI/8,dx=Math.sin(angle),dy=-Math.cos(angle),skeleton=pet.skeleton,update=skeleton.updateWorldTransform;skeleton.updateWorldTransform=function(){const head=this.findBone('F_Head');if(head)head.rotation+=dx*3;for(const name of ['F_L_Eyeball','F_R_Eyeball']){const eye=this.findBone(name);if(eye){eye.x+=dx*1.8;eye.y-=dy*1.2}}update.call(this)};try{pet.update(0)}finally{skeleton.updateWorldTransform=update}app.renderer.render(app.stage);return app.view.toDataURL('image/png');};
</script>
