<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艾丽妮 2.0.0 · 官方小人</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#191a22;color:#f2eee9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:min(960px,100%)}.eyebrow{font-size:12px;color:#c68c9f;letter-spacing:3px}h1{font-size:32px;margin:10px 0 12px;font-weight:600}p{color:#b9b5c0;line-height:1.8;margin:0 0 22px}.panel{border:1px solid #41404d;background:#23242d;border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px}.stage{min-height:400px;border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#55505b,#302f3b 65%);display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{width:288px;height:312px;image-rendering:auto}#status{color:#e6b3c3;font-size:14px;margin:16px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{font:inherit;border:1px solid #57515f;background:#34323e;color:#e7e0e7;border-radius:10px;padding:12px;cursor:pointer}button:hover,button.active{background:#725363;border-color:#c58b9f}#sequence{width:100%;margin-top:18px;background:#bc7f96;color:#171820;font-weight:600}.control{display:flex;gap:12px;align-items:center;margin-top:16px;color:#b9b5c0;font-size:13px}.caption{font-size:13px;margin-top:18px}.links{display:flex;gap:18px;margin-top:20px;flex-wrap:wrap}a{color:#d8a5b8;font-size:13px}#error{color:#efbd99}@media(max-width:650px){.panel{grid-template-columns:1fr}.stage{min-height:330px}h1{font-size:27px}}
</style>
<main>
<div class="eyebrow">ARKNIGHTS × CODEX</div>
<h1>艾丽妮 2.0.0 · 官方小人</h1>
<p>三种官方基建外观。选择工作状态查看 Codex 图集，或打开页面末尾的完整原有动画。</p>
<div class="panel">
 <div class="stage"><canvas id="pet" width="192" height="208"></canvas><div id="status">准备素材</div></div>
 <div>
  <div class="buttons" id="buttons"></div>
  <button id="sequence">演示：思考 → 等待 → 审阅 → 完成</button>
  <div class="control"><label><input type="checkbox" id="pause"> 暂停</label><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div>
  <div class="control"><label>画质 <select id="quality"><option value="hd" selected>高清原始素材</option><option value="native">Codex 宠物尺寸</option></select></label></div>
  <div class="control"><label>外观 <select id="skin"><option value="default">默认</option><option value="synesthesia">飞羽</option><option value="game">至高判决</option></select></label><select id="movement" hidden><option value="walk">官方行走</option></select></div>
  <div class="control"><label>播放 <select id="playback"><option value="codex" selected>Codex 宿主节奏</option><option value="web">连续循环</option></select></label></div>
  <div class="control"><label><input type="checkbox" id="follow" checked> 跟随指针</label></div>
  <p class="caption">待机使用睁眼片段，互动来自官方动作。Codex 图集按宿主少帧采样；以下原有动画链接保留完整 20 fps。工作流演示由页面计时器驱动。</p>
  <div id="error"></div>
 </div>
</div>
<div class="links"><a data-clip="Relax" href="assets/official/default/previews/Relax.webp">完整待机</a><a data-clip="Move" href="assets/official/default/previews/Move.webp">完整行走</a><a data-clip="Interact" href="assets/official/default/previews/Interact.webp">完整互动</a><a data-clip="Sit" href="assets/official/default/previews/Sit.webp">完整坐下</a><a data-clip="Sleep" href="assets/official/default/previews/Sleep.webp">完整睡觉</a><a href="官方小人使用说明.md">安装说明</a></div>
</main>
<script src="preview-player.js"></script>
</html>
